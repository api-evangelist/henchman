description: >-
  FinOps view of Henchman spend. Henchman is sold as a sales-led enterprise
  subscription (base package plus optional Dynamic Knowledge and AI Clause Assistant
  add-ons), not as a metered, usage-based developer API. There are no published
  per-token, per-call, or per-request rates and no public API billing exports.
  Cost management is therefore a procurement and license-management exercise rather
  than usage-based FinOps. Following the LexisNexis acquisition (2024), Henchman
  capabilities are also delivered through Lexis+ AI and Lexis Create+, which are
  billed under LexisNexis commercial terms.
notes: >-
  No usage-based meters are published; the meters below are descriptive placeholders
  for license-based allocation, not reconciled billing dimensions. Reconcile only if
  a metered developer API is ever published.
