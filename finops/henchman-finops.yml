principles:
- name: Visibility
  description: Track Henchman seats/licenses against the negotiated contract; there are no usage-based API exports to inspect.
- name: Allocation
  description: Allocate seat and add-on costs to the legal teams and matters that use the add-ins.
- name: Optimization
  description: Right-size seat counts and add-on selection (Dynamic Knowledge, AI Clause Assistant) at renewal; consolidate under Lexis+ AI / Lexis Create+ where applicable.
- name: Accountability
  description: Assign a license owner; review seat utilization annually against the renewal.
