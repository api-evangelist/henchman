aid: henchman
url: https://raw.githubusercontent.com/api-evangelist/henchman/refs/heads/main/apis.yml
name: Henchman
kind: company
description: Henchman is a legal knowledge and contract-drafting AI platform that surfaces
  a firm's own past clauses and definitions from its document management system directly
  inside Microsoft Word, Outlook, and Copilot. It connects to legal DMS platforms
  (iManage, NetDocuments, SharePoint, OneDrive, Google Drive, OpenText eDocs),
  extracts and ranks clauses and definitions, and adds a secure multi-LLM AI clause
  assistant on top. Henchman was acquired by LexisNexis in 2024 and is being
  integrated into Lexis+ AI and Lexis Create+. Henchman is delivered primarily as
  add-ins and DMS connectors; it does not publish a public developer API.
